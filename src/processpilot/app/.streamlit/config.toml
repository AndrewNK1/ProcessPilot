# ProcessPilot's look. Script-level config: Streamlit reads it from the main
# script's folder, so it applies whatever directory `streamlit run` starts in.
#
# Light and dark are both defined, which keeps the appearance switchable; the
# sidebar's theme switch (app/theme.py) chooses between them. Colours were
# checked for WCAG AA: body text >= 4.5:1 on every surface, white button
# labels >= 4.5:1 on the primary colour in both modes.

[server]
# Serves app/static (the vendored IBM Plex fonts) at app/static/...
enableStaticServing = true

[client]
# A tool for analysts, not a Streamlit dev session: no Deploy button.
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
font = "IBM Plex Sans, sans-serif"
codeFont = "IBM Plex Mono, monospace"
baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["26px", "19px", "16px", "15px", "14px", "13px"]
headingFontWeights = [600, 600, 600, 600, 500, 500]
metricValueFontSize = "26px"
metricValueFontWeight = 500
codeFontSize = "0.86em"
baseRadius = "6px"
buttonRadius = "6px"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false
paddingTop = "1.5rem"
paddingBottom = "3rem"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-Regular.woff2"
weight = 400

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-Medium.woff2"
weight = 500

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-SemiBold.woff2"
weight = 600

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-Bold.woff2"
weight = 700

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/IBMPlexMono-Regular.woff2"
weight = 400

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/IBMPlexMono-Medium.woff2"
weight = 500

# --- light: white canvas, tinted neutral sidebar, petrol teal on data and the
# one primary action --------------------------------------------------------
[theme.light]
primaryColor = "#0B6E77"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5F5"
textColor = "#141A1B"
borderColor = "#D5DBDB"
linkColor = "#0A5F67"
codeTextColor = "#0A5F67"
codeBackgroundColor = "#EDF3F3"
dataframeBorderColor = "#E3E7E7"
dataframeHeaderBackgroundColor = "#FFFFFF"
dataframeHeaderTextColor = "#566062"
redColor = "#B42318"
orangeColor = "#B45309"
yellowColor = "#A16207"
greenColor = "#1F7A4D"
blueColor = "#0B6E77"
grayColor = "#566062"
chartCategoricalColors = ["#0B6E77", "#566062", "#9AA5A7", "#B45309"]

[theme.light.sidebar]
backgroundColor = "#F6F7F7"
secondaryBackgroundColor = "#ECEFEF"
textColor = "#141A1B"
borderColor = "#DCE1E1"
primaryColor = "#0B6E77"
linkColor = "#0A5F67"
codeBackgroundColor = "#E6ECEC"

# --- dark: true neutral darks (no navy), lightness steps for surfaces ------
[theme.dark]
primaryColor = "#1A7F88"
backgroundColor = "#111415"
secondaryBackgroundColor = "#1B2022"
textColor = "#E7ECEC"
borderColor = "#2F3739"
linkColor = "#5CC6CF"
codeTextColor = "#7DD3DA"
codeBackgroundColor = "#1A2526"
dataframeBorderColor = "#262D2F"
dataframeHeaderBackgroundColor = "#111415"
dataframeHeaderTextColor = "#A3ADAF"
redColor = "#F0756A"
orangeColor = "#F0A35A"
yellowColor = "#E3B055"
greenColor = "#4CC38A"
blueColor = "#3CB4BE"
grayColor = "#A3ADAF"
chartCategoricalColors = ["#3CB4BE", "#A3ADAF", "#5E696B", "#F0A35A"]

[theme.dark.sidebar]
backgroundColor = "#0D1011"
secondaryBackgroundColor = "#181D1F"
textColor = "#E7ECEC"
borderColor = "#252C2E"
primaryColor = "#1A7F88"
linkColor = "#5CC6CF"
codeBackgroundColor = "#172122"
