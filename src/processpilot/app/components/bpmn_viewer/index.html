<!doctype html>
<!--
  Streamlit component: read-only BPMN viewer (bpmn-js navigated viewer, zoom + pan).

  WHY hand-written instead of streamlit-component-lib: the component protocol is
  three postMessage types (componentReady, render, setFrameHeight), and the npm
  helper would add a build step to a Python project. Everything is served from
  this folder, so the viewer works offline.

  Theme: Streamlit sends its active theme with every render; the diagram takes
  the theme's ground, ink and border colours (bpmn-js `bpmnRenderer` defaults),
  and the viewer is rebuilt when the appearance changes. Tasks named in
  `highlight` (what a proposal changes) get the theme's primary colour.

  The bpmn.io watermark is part of bpmn-js and must stay fully visible
  (LICENSE-bpmn-js). Its inline colour (#404040) would vanish on a dark canvas,
  so it takes the theme's text colour instead; it is never hidden or covered.
-->
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="diagram-js.css">
  <link rel="stylesheet" href="bpmn-js.css">
  <style>
    :root { --ground: #ffffff; --ink: #141a1b; --rule: #d5dbdb; --accent: #0b6e77; }
    html, body { margin: 0; padding: 0; background: transparent; }
    #canvas { width: 100%; box-sizing: border-box; border: 1px solid var(--rule);
      border-radius: 6px; background: var(--ground); overflow: hidden; }
    #error { display: none; padding: 8px 2px; color: #b42318; font: 14px/20px sans-serif; }
    .bjs-powered-by { color: var(--ink) !important; opacity: 0.85; }
    .pp-changed .djs-visual > :first-child { stroke: var(--accent) !important;
      stroke-width: 3px !important; }
    .pp-changed .djs-visual text { fill: var(--accent) !important; }
  </style>
  <script src="bpmn-navigated-viewer.production.min.js"></script>
</head>
<body>
  <div id="canvas"></div>
  <div id="error"></div>
  <script>
    const canvasEl = document.getElementById("canvas");
    const errorEl = document.getElementById("error");
    let viewer = null;
    let viewerTheme = null;
    let shown = null;

    function send(type, data) {
      window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
    }

    function colours(theme) {
      const dark = theme && theme.base === "dark";
      return {
        ground: (theme && theme.backgroundColor) || (dark ? "#111415" : "#ffffff"),
        ink: (theme && theme.textColor) || (dark ? "#e7ecec" : "#141a1b"),
        rule: dark ? "#2f3739" : "#d5dbdb",
        accent: dark ? "#3cb4be" : ((theme && theme.primaryColor) || "#0b6e77"),
      };
    }

    function ensureViewer(theme) {
      const c = colours(theme);
      const signature = JSON.stringify(c);
      if (viewer && viewerTheme === signature) return false;
      if (viewer) viewer.destroy();
      const root = document.documentElement.style;
      root.setProperty("--ground", c.ground);
      root.setProperty("--ink", c.ink);
      root.setProperty("--rule", c.rule);
      root.setProperty("--accent", c.accent);
      viewer = new BpmnJS({
        container: canvasEl,
        bpmnRenderer: { defaultFillColor: c.ground, defaultStrokeColor: c.ink, defaultLabelColor: c.ink },
      });
      viewerTheme = signature;
      return true;
    }

    window.addEventListener("message", async (event) => {
      const msg = event.data;
      if (!msg || msg.type !== "streamlit:render") return;
      const height = msg.args.height;
      canvasEl.style.height = height + "px";
      send("streamlit:setFrameHeight", { height: height + 30 });
      const rebuilt = ensureViewer(msg.theme);
      const key = JSON.stringify([msg.args.xml, msg.args.highlight || []]);
      if (!rebuilt && key === shown) return;
      shown = key;
      try {
        await viewer.importXML(msg.args.xml);
        const canvas = viewer.get("canvas");
        const wanted = new Set(msg.args.highlight || []);
        if (wanted.size) {
          viewer.get("elementRegistry")
            .filter((el) => el.businessObject && wanted.has(el.businessObject.name))
            .forEach((el) => canvas.addMarker(el.id, "pp-changed"));
        }
        canvas.zoom("fit-viewport", "auto");
        errorEl.style.display = "none";
      } catch (err) {
        errorEl.textContent = "Could not display the model: " + err.message;
        errorEl.style.display = "block";
      }
    });

    send("streamlit:componentReady", { apiVersion: 1 });
  </script>
</body>
</html>
