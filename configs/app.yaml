# ---------------------------------------------------------------------------
# Application settings: one FastAPI process serves the API and the web app
# (React, built from web/ into src/processpilot/api/static).
#
# Paths are not configured here: runs go to outputs/runs (PP_RUNS_DIR) and
# the API's own state (SQLite index, uploads) to outputs/app (PP_APP_DIR).
# ---------------------------------------------------------------------------
api:
  host: 127.0.0.1
  port: 8000
  # Background jobs (profiling, validation, mining, agent runs) run in this
  # many threads. 1 on purpose: mining is CPU-bound, and one worker never has
  # two jobs writing the same run's checkpoint database at once.
  job_workers: 1
  # Largest accepted upload, enforced by the API.
  max_upload_mb: 1024

# Read by the web app through GET /settings/ui.
ui:
  # How often a screen waiting on a background job asks the API for news.
  poll_seconds: 1.0
  # Height of the BPMN viewers (as-is and to-be models).
  bpmn_height_px: 420
