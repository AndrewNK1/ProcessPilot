# ---------------------------------------------------------------------------
# Agent (Phase 3) settings. Dataset-independent: dataset knowledge lives in
# the preset (constraints, domain_knowledge), not here.
# ---------------------------------------------------------------------------

model:
  # The model id itself comes from this environment variable (provider-
  # swappable via init_chat_model), so switching models never edits a file
  # in the repo.
  env_var: PP_MODEL
  # Passed straight to init_chat_model -> the provider's chat class, chosen by
  # the provider prefix of PP_MODEL. A provider missing here fails loudly:
  # some chat classes silently ignore unknown keys, so sharing one dict would
  # quietly run with provider defaults.
  init_kwargs:
    # ChatAnthropic (langchain-anthropic 1.7). `effort` is set explicitly
    # because Claude Opus 5.5's implicit default is `medium`; diagnosis is
    # reasoning-heavy, so `high` is used and logged. Thinking cannot be
    # disabled on Opus 5.5, and sampling params (temperature, seed) are
    # rejected, so LLM output is NOT bit-reproducible: reproducibility comes
    # from logging every prompt and raw output instead.
    anthropic:
      effort: high
      max_tokens: 16000
    # ChatOllama (langchain-ollama 1.1, Ollama 0.40), local CPU model.
    # num_ctx: Ollama's default context is smaller than a segment's evidence
    #   digest and it truncates the prompt silently; 8192 fits the largest
    #   digest (~4.5k tokens) plus output on an 8 GB machine.
    # reasoning: false -> Ollama `think: false`. Thinking output slows a CPU
    #   model a lot and can break JSON parsing.
    # temperature 0 + seed: repeatable on the same machine and build.
    ollama:
      num_ctx: 8192
      num_predict: 2048
      temperature: 0
      seed: 42
      reasoning: false
    # ChatGroq (langchain-groq 1.1.3), hosted on Groq, e.g.
    # PP_MODEL=groq:openai/gpt-oss-120b. gpt-oss is a reasoning model;
    # `reasoning_effort: high` for the same reason as Anthropic's `effort`.
    # temperature 0 makes reruns closer, but Groq does not promise
    # bit-identical output, so prompts and raw outputs are still logged.
    groq:
      reasoning_effort: high
      temperature: 0
      max_tokens: 16000
    # ChatMistralAI (langchain-mistralai 1.1.6), hosted by Mistral, e.g.
    # PP_MODEL=mistralai:mistral-large-latest; key in MISTRAL_API_KEY.
    # temperature 0 + random_seed make reruns closer, but Mistral does not
    # promise bit-identical output, so prompts and raw outputs are still logged.
    mistralai:
      temperature: 0
      random_seed: 42
      max_tokens: 16000
    # ChatGoogleGenerativeAI (langchain-google-genai 4.4.2), Gemini API, e.g.
    # PP_MODEL=google_genai:gemini-3.6-flash; key in GOOGLE_API_KEY.
    # No temperature/top_p/top_k (user decision 2026-11-16): Google documents
    # them as "deprecated and ignored" for Gemini 3.6 Flash and later
    # (https://ai.google.dev/gemini-api/docs/generate-content/whats-new-gemini-3.6,
    # checked 2026-11-13). Left unset, langchain-google-genai 4.4.2 sends no
    # temperature for Gemini 3+ models. The seed is still sent; whether it has
    # any effect is UNVERIFIED (see `notes`), so prompts and raw outputs are logged.
    # thinking_level pinned to "medium" (user decision 2026-11-17): it is Google's
    # documented default for gemini-3.6-flash today, but pinning it means a later
    # change of the default cannot silently change the evaluation. In
    # langchain-google-genai 4.4.2 `thinking_level` is the alias of the
    # `reasoning_effort` field and is sent as generationConfig.thinkingConfig.
    # max_retries: 1 = the first request only, no SDK retries (evaluation
    # Phase 5). langchain-google-genai 4.4.2 documents 1 (not 0) as "no
    # retries"; its default is 6, which would send hidden requests that the
    # quota ledger cannot see. 429s, 5xx and timeouts are handled by
    # agent/ratelimit.py instead.
    google_genai:
      seed: 42
      max_output_tokens: 16000
      thinking_level: medium
      max_retries: 1
  # Caveats copied into every run's inputs.json and summary.json for the
  # provider in use, so a reader of the logs sees what a setting does not do.
  notes:
    google_genai:
      - >-
        seed=42 is sent; its effect on Gemini output is UNVERIFIED (Google's
        Gemini 3.6 documentation does not mention seed).
      - >-
        temperature, top_p and top_k are not sent: Google documents them as
        deprecated and ignored for Gemini 3.6 Flash and later.
      - >-
        thinking_level=medium is sent explicitly (Google's documented default for
        gemini-3.6-flash, pinned so a default change cannot alter runs); the
        response does not echo the level, so its application is not confirmed.
  # `json_schema` = the provider's native structured-output mode. Forced tool
  # calling ("function_calling") is rejected by Claude Opus 5.5 / Sonnet 5.5.
  structured_output_method: json_schema

validation:
  # Retries after the first attempt, each feeding the validation errors back.
  max_retries: 2

review:
  # Reject-with-comment loops back to redesign at most this many times; the
  # next rejection finalises the run as "rejected".
  max_revision_loops: 2

redesign:
  # Assumptions of the replay-based impact ESTIMATE (redesign/simulate.py).
  # Shown next to every estimate; change them here, never in code.
  estimate:
    # Share of an automated activity's wait that disappears. Cautious default
    # chosen by the user (Phase 4); not measured from any log.
    automate_wait_reduction: 0.5
    # Cost of a newly added activity or check per occurrence:
    # segment_median = the segment's median wait before an activity; zero.
    added_activity_wait: segment_median
  # Woflan is run as an independent soundness check only up to this many
  # Petri-net transitions. Measured on BPI 2019: 22 and 33 transitions finish
  # in < 0.2 s; 91 and 126 did not finish within 120 s. Larger models rely on
  # soundness by construction plus the structural check (redesign/soundness.py).
  woflan_max_transitions: 40

# USD per million tokens. Anthropic list prices cached 2026-10-06; verify
# against the provider's pricing page before quoting a cost in the thesis.
# Cache writes are 1.25x input (5-minute TTL). A model missing here is logged
# with cost "unknown" rather than a guessed price.
pricing_usd_per_mtok:
  claude-opus-5-5: {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}
  claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50}
  claude-sonnet-5: {input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50}
  claude-haiku-5-5: {input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125}
  # Gemini 3.6 Flash, paid Standard tier, from https://ai.google.dev/gemini-api/docs/pricing
  # (served at aistudio.google.com/docs/pricing), read 2026-11-16. Output includes
  # thinking tokens. cache_read = context-caching price (Gemini's implicit caching
  # reports cached input tokens; there is no separate write charge, so cache_write
  # = input). These prices hold "through December 31, 2026"; from 2027-01-01 the
  # page lists 1.50 / 7.50 / 0.15, so update this line before costing later calls.
  # The free tier is not billed: logged costs are estimates at list price.
  gemini-3.6-flash: {input: 0.75, output: 3.75, cache_read: 0.075, cache_write: 0.75}
