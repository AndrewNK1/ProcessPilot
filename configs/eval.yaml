# ---------------------------------------------------------------------------
# Evaluation settings (EVALUATION_PLAN.md). Read by src/processpilot/evaluation
# and the scripts in scripts/eval/. Not a dataset preset (no `discovery`).
#
# Phase 5 adds `rate_limit`, Phase 6 adds `baseline`; sealing a campaign
# refuses until both exist, because the sealed manifest must record them.
# ---------------------------------------------------------------------------

campaign:
  # The frozen mining run must have been mined with this preset (checked when
  # the campaign is drafted; the preset's content hash is checked again on
  # sealing and before every run).
  preset: bpi2019
  repetitions: 5
  conditions: [processpilot, baseline]

# The RQ1 reference list. Fixed in the thesis methodology (Chapter 3); do not
# tune. Per segment: the top-N bottlenecks by impact, plus every conformance
# rule whose completed-case violation share is strictly greater than the
# threshold. If no rule passes, the key holds the bottlenecks only and says so.
answer_key:
  top_n_bottlenecks: 3
  conformance_completed_share_gt: 0.01

# Phase 5 (user decisions 2026-11-16/18). Gemini quota: 5 requests/minute and
# 20/day per Google Cloud project; the day resets at midnight Pacific time.
rate_limit:
  providers: [google_genai]           # model-id prefixes that go through the limiter
  min_seconds_between_calls: 20       # 5 RPM limit -> at most 3 calls/min, safety margin
  seconds_between_runs: 180
  daily_request_budget: 17            # quota is 20; leave headroom
  # Start a run only if today's remaining budget covers its worst case
  # (ProcessPilot: 2 calls + up to 2 validation retries each; baseline: 1 + 2).
  worst_case_calls: {processpilot: 6, baseline: 3}
  quota_timezone: America/Los_Angeles # quota day = calendar day here (zoneinfo)
  display_timezone: Africa/Cairo      # reset times are shown in this zone
  default_retry_seconds: 65           # per-minute 429 without a retryDelay
  max_transport_retries: 5            # per call, for per-minute / unclassified 429s
  # 5xx and timeouts: one retry per entry, after these waits (increasing,
  # user decision 2026-11-18, after the first smoke run met a Gemini overload).
  server_retry_seconds: [60, 120, 240]
  # One ledger for the whole Google project (app and runner share the quota),
  # every line tagged with purpose/campaign. Relative to the project root;
  # $PP_QUOTA_LEDGER overrides it.
  ledger: outputs/quota/google_genai.jsonl
