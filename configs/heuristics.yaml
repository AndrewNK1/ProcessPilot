# ---------------------------------------------------------------------------
# Redesign heuristics catalogue (Reijers & Mansar, 2005 - "Best practices in
# business process redesign: an overview and qualitative evaluation of
# successful redesign heuristics", Omega 33(4)).
#
# The redesign agent may ONLY select a heuristic_id that appears here, and only
# one with `bpmn_editable: true` (a proposal must be expressible as typed edit
# operations). This keeps proposals inside an academically defensible design
# space instead of letting the model invent interventions.
#
# `when_applicable` is phrased in terms of evidence that exists in the Phase 2
# store (evidence type + metric names from mining/evidence.py), so the agent
# can be checked against it: a proposal citing only variant evidence for a
# heuristic whose signals are all resource-based is suspect.
#
# `confidence`:
#   established - the heuristic is in Reijers & Mansar's catalogue under this
#                 name and the evidence mapping is a direct reading of it.
#   uncertain   - the heuristic is in the catalogue, but mapping it onto
#                 single-timestamp event-log evidence is this project's own
#                 interpretation and should be argued in the thesis.
#
# STATUS: v1 (Phase 3). Phase 4 may tighten the typical_operations once
# bpmn_edit implements them.
# ---------------------------------------------------------------------------
version: 1

heuristics:
  - id: H-TASK-ELIMINATION
    name: Task elimination
    description: >-
      Remove a task that adds no value for the customer or for a control
      objective. Typically applied to checks that almost never find anything
      and to repeated executions of the same task.
    when_applicable:
      - evidence_type: rework
        signal: "high case_share and extra_occurrences for a repeated activity"
      - evidence_type: conformance
        signal: "a control step whose rule is (almost) never violated, i.e. violation_share near 0"
    typical_operations: [remove_activity]
    risks: "Removes a control; only valid where the control's hit rate is near zero."
    bpmn_editable: true
    confidence: established

  - id: H-TASK-COMPOSITION
    name: Task composition
    description: >-
      Combine small tasks into one composite task to cut handover and setup
      time between them.
    when_applicable:
      - evidence_type: bottleneck
        signal: "a transition between two activities with high case_share and a long median wait"
      - evidence_type: resource
        signal: "a handover (HO-*) on the same edge with handover wait far above same-resource wait"
    typical_operations: [merge_activities]
    risks: "Larger tasks reduce flexibility, raise required skill level, and can break segregation of duties."
    bpmn_editable: true
    confidence: established

  - id: H-RESEQUENCING
    name: Resequencing
    description: >-
      Move a task to a different position in the process, e.g. earlier, so
      that downstream waiting or rework is avoided.
    when_applicable:
      - evidence_type: rework
        signal: "an activity repeated in many cases, where a later step appears to trigger the repeat"
      - evidence_type: variant
        signal: "frequent variants that differ mainly in the order of the same activities"
    typical_operations: [reorder_activities]
    risks: "Earlier execution may act on information that is not yet final."
    bpmn_editable: true
    confidence: established

  - id: H-PARALLELISM
    name: Parallelism
    description: >-
      Execute tasks that have no real data dependency concurrently instead of
      sequentially, so the segment costs max() rather than sum() of durations.
    when_applicable:
      - evidence_type: bottleneck
        signal: "consecutive transitions with long median waits between activities that do not consume each other's output"
      - evidence_type: variant
        signal: "frequent variants where the same activities occur in either order (suggests no hard dependency)"
    typical_operations: [parallelize_activities]
    risks: "Coordination overhead; invalid if a hidden dependency exists."
    bpmn_editable: true
    confidence: established

  - id: H-TRIAGE
    name: Triage
    description: >-
      Split a general task into alternative variants for different case types,
      or merge variants into one task when the distinction no longer pays off.
    when_applicable:
      - evidence_type: variant
        signal: "the same activity sits in variants with very different median_throughput_seconds"
    typical_operations: [add_activity, reorder_activities]
    risks: "More process variants to maintain and govern."
    bpmn_editable: true
    # Reijers & Mansar's triage is defined on task duration, which a
    # single-timestamp log does not record; variant throughput is a proxy.
    confidence: uncertain

  - id: H-KNOCKOUT
    name: Knock-out ordering
    description: >-
      Order checks that can terminate a case by decreasing rejection rate per
      unit of effort, so cheap rejections happen first.
    when_applicable:
      - evidence_type: variant
        signal: "variants ending in a cancellation/deletion activity after several earlier steps"
    typical_operations: [reorder_activities]
    risks: "Requires reliable rejection-rate data per check, which the evidence does not provide directly."
    bpmn_editable: true
    confidence: uncertain

  - id: H-AUTOMATION
    name: Task automation
    description: >-
      Replace manual execution of a task with system execution, removing the
      queueing time that human capacity imposes.
    when_applicable:
      - evidence_type: bottleneck
        signal: "a frequent transition (high case_share) into a routine activity with a long median wait"
      - evidence_type: resource
        signal: "a single resource (RS-*) recording a large event_share of one routine activity"
    typical_operations: [merge_activities, remove_activity]
    risks: "Implementation cost; exception handling must stay manual."
    bpmn_editable: true
    confidence: established

  - id: H-INTEGRAL-TECHNOLOGY
    name: Integral technology
    description: >-
      Remove a physical or informational constraint by applying technology,
      e.g. electronic invoicing removing postal transfer delay.
    when_applicable:
      - evidence_type: bottleneck
        signal: "a long median wait on a transition that crosses an organisational boundary (e.g. into a vendor-side activity)"
    typical_operations: [remove_activity, merge_activities]
    risks: "Depends on counterparty capability, e.g. supplier readiness."
    bpmn_editable: true
    confidence: uncertain

  - id: H-EXCEPTION
    name: Exception isolation
    description: >-
      Design the mainstream flow for normal cases and route exceptions to a
      separate path, so exceptions stop disturbing the happy path.
    when_applicable:
      - evidence_type: variant
        signal: "a low top_n_case_share (many rare variants) with rare variants much slower than the happy path"
      - evidence_type: kpi
        signal: "mean throughput far above median throughput (a long tail of slow cases)"
    typical_operations: [add_activity, reorder_activities]
    risks: "Needs a reliable early classifier to route cases."
    bpmn_editable: true
    confidence: established

  - id: H-CASE-BASED-WORK
    name: Case-based work
    description: >-
      Remove constraints that make cases wait for each other, such as periodic
      batch processing, so each case is processed when it is ready.
    when_applicable:
      - evidence_type: bottleneck
        signal: "a transition with a long median wait into an activity that is typically executed in periodic runs"
    typical_operations: [remove_activity, reorder_activities]
    risks: "Loses economies of scale in setup-heavy tasks; batching may be contractual (payment runs)."
    bpmn_editable: true
    # The evidence has no inter-arrival or calendar analysis, so batching can
    # only be suspected, not shown.
    confidence: uncertain

  - id: H-NUMERICAL-INVOLVEMENT
    name: Numerical involvement
    description: >-
      Minimise the number of departments, groups or people involved in a
      process to reduce handovers and coordination.
    when_applicable:
      - evidence_type: resource
        signal: "HO-00 median_handover_wait_seconds far above median_same_resource_wait_seconds"
      - evidence_type: resource
        signal: "handover items (HO-*) with high handover_share_of_transitions on high-impact edges"
    typical_operations: [merge_activities, remove_activity]
    risks: "Can concentrate risk and reduce segregation of duties."
    bpmn_editable: true
    confidence: established

  - id: H-CONTROL-RELOCATION
    name: Control relocation
    description: >-
      Move controls towards the party best placed to perform them, e.g. let
      the supplier or a system validate data before it reaches the process.
    when_applicable:
      - evidence_type: rework
        signal: "a correction or change activity repeated in many cases"
      - evidence_type: conformance
        signal: "a rule with a material violation_share on completed cases"
    typical_operations: [add_activity, remove_activity, reorder_activities]
    risks: "Depends on the other party's reliability; the organisation keeps accountability for the control."
    bpmn_editable: true
    confidence: uncertain

  - id: H-EXTRA-RESOURCES
    name: Extra resources
    description: >-
      Increase capacity at a specific task where queueing, not task duration,
      drives throughput time.
    when_applicable:
      - evidence_type: resource
        signal: "workload highly skewed (one resource with a large event_share) and waiting concentrated at that resource's activities"
    typical_operations: []
    risks: "Cost; does not fix structural problems."
    # Capacity-only change: no BPMN edit is possible, so redesign may not
    # select it (user decision, Phase 3). Diagnosis may still name it as an
    # alternative explanation.
    bpmn_editable: false
    confidence: established
