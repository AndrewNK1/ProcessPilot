# ---------------------------------------------------------------------------
# Dataset preset: BPI Challenge 2019 (purchase-to-pay).
#
# This file exists so that NOTHING about BPI 2019 is hardcoded in src/. The
# engine reads a preset; swapping datasets means swapping this file only.
#
# STATUS: verified against the actual log in Phase 1 (full parse of the real
# 728.6 MB XES, 2026-10-16): 1,595,923 events, 251,734 cases, 42 distinct
# activities, 21 raw columns (16 case: attributes + 5 event attributes).
# Every column name, activity name, and segment value below matched the
# challenge documentation exactly EXCEPT the timestamp upper bound -- see the
# `validation` block. Re-verify this block if the source file ever changes.
# ---------------------------------------------------------------------------
name: bpi2019
description: >-
  BPI Challenge 2019 purchase-to-pay event log from a multinational coatings
  and paints company. ~250k purchase order items, 4 item categories that
  correspond to genuinely different P2P flows.

source:
  type: file
  # Resolved from the environment so the machine-specific absolute path is
  # never committed. See .env.example.
  path_env: PP_BPI2019_PATH

# --- column mapping (ColumnMapping in ingest/mapping.py) -------------------
# XES standard attributes; pm4py exposes case attributes with a `case:` prefix.
mapping:
  case_id: "case:concept:name"
  activity: "concept:name"
  timestamp: "time:timestamp"
  resource: "org:resource"
  # Each Item Category is a materially different purchase-to-pay flow, so the
  # pipeline runs per category rather than on a blended model.
  segment_by: "case:Item Category"
  timestamp_format: null # ISO 8601 in XES; pm4py parses it.

# XES timestamps are timezone-aware but the canonical schema requires tz-naive
# datetime64[ns]. DECISION (Phase 0): convert to UTC, then drop the offset.
# WHY: UTC is monotonic, so a waiting time spanning a DST boundary is correct.
# COST: wall-clock values shift 1-2h from what a user sees in the source ERP,
# which only matters for working-hour / resource-calendar analysis. If such
# analysis is added later, the local wall clock must be kept as a separate
# `attr:` column rather than by changing this policy.
timestamp_timezone_policy: utc

# Confirmed in Phase 1 against the real log:
#   - "case:Item Category" has exactly 4 values, matching every
#     `applies_to_segments` entry below verbatim:
#       "3-way match, invoice before GR"  221,010 cases
#       "3-way match, invoice after GR"    15,182 cases
#       "Consignment"                      14,498 cases
#       "2-way match"                       1,044 cases
#   - "org:resource" is fully populated (0% null), 628 distinct resources.

# --- validation thresholds (no magic numbers in code) ---------------------
validation:
  # BPI 2019 contains junk timestamps; the real min was 1948-01-26 (clearly a
  # sentinel/default value, not a real SAP transaction) -- never silently
  # repaired, only flagged. CORRECTED in Phase 1: the real max timestamp is
  # 2020-04-09, which is *after* the originally configured upper bound of
  # 2020-01-01 -- that bound would have wrongly flagged ~3 months of genuine
  # events as junk. Widened with headroom above the observed max.
  plausible_timestamp_min: "2017-01-01"
  plausible_timestamp_max: "2020-05-01"
  max_distinct_activities_warn: 200
  min_events_per_case_warn: 2

# Cleaning is opt-in and chosen by the caller; listed here as the suggested
# default policy for this dataset, not as something applied automatically.
suggested_cleaning_policy:
  drop_cases_with_out_of_range_timestamps: true
  drop_single_event_cases: false
  drop_exact_duplicate_events: false

# --- discovery -------------------------------------------------------------
discovery:
  inductive_miner_noise_threshold: 0.2
  dfg_min_edge_frequency_share: 0.01

analysis:
  top_n_bottlenecks: 10
  top_n_variants: 10
  top_n_rework: 10
  top_n_resources: 15
  top_n_handovers: 10
  max_example_cases: 5

# --- mining-time view of the log (Phase 2) ---------------------------------
preprocessing:
  # ~181k events are same-case, same-activity, same-instant repeats (137k
  # "Record Service Entry Sheet", 43k "Record Goods Receipt"): line items
  # posted together. Collapsed to one event for DFG/variants/rework so they do
  # not appear as zero-wait loops or rework; resource workload keeps raw counts.
  collapse_same_instant_repeats: true

# A case counts as completed if its last activity is one of these. Measured
# on the real log (last activity per case): Clear Invoice ends 77.8% of
# "3-way before GR", 61.0% of "3-way after GR", 15.9% of "2-way match";
# Consignment is never invoiced in this log and ends in Record Goods Receipt
# for 90.6% of cases. Delete Purchase Order Item is a (cancelled) completion.
case_completion:
  end_activities:
    - "Clear Invoice"
    - "Delete Purchase Order Item"
  per_segment:
    "Consignment":
      - "Record Goods Receipt"
      - "Delete Purchase Order Item"

# --- conformance rules (P2P domain rules) ---------------------------------
# Rule types are implemented generically in mining/conformance.py; the rules
# themselves are data. `applies_to_segments: null` means all segments.
#
# Each rule's `checked` note records what was measured against the real log
# (2026-10-16, uncleaned, all 251,734 cases). For order rules "violations"
# counts cases containing both activities where the first B precedes the
# first A. These are plausibility checks of the rule, not Phase 2 results.
conformance_rules:
  - id: R-01
    name: three_way_match_order
    type: activity_a_before_activity_b
    description: >-
      In a three-way match the goods receipt must be recorded before the
      invoice is recorded, otherwise the match cannot be performed on receipt.
    params:
      a: "Record Goods Receipt"
      b: "Record Invoice Receipt"
    applies_to_segments:
      - "3-way match, invoice after GR"
    # checked: 11,128 cases contain both; 0 violations. Holds by construction
    # in this category, so it guards data integrity rather than finding issues.

  # R-02 REPLACED in the Phase 1 review. The original rule required "Clear
  # Invoice" before "Vendor creates debit memo" and described it as payment
  # control -- but a debit memo is a vendor credit, not a payment, and it
  # normally precedes clearing: 5,441 of 5,676 cases with both (96%) "violated"
  # it. A rule that most compliant cases break would have produced a false
  # headline finding in Phase 2.
  - id: R-02
    name: invoice_recorded_before_cleared
    type: activity_a_before_activity_b
    description: >-
      An invoice must be recorded before it is cleared; clearing an invoice
      that was never recorded bypasses the invoice-verification control.
    params:
      a: "Record Invoice Receipt"
      b: "Clear Invoice"
    # Consignment is never invoiced in this log, so the rule cannot be
    # evaluated there (0 cases contain both activities).
    applies_to_segments:
      - "2-way match"
      - "3-way match, invoice after GR"
      - "3-way match, invoice before GR"
    # checked: 183,293 cases contain both; 24 violations (7 in "3-way match,
    # invoice after GR", 17 in "3-way match, invoice before GR").

  - id: R-03
    name: invoice_must_occur
    type: activity_must_occur
    description: >-
      Every completed purchase order item must have an invoice receipt; its
      absence indicates either an incomplete case or a process breakdown.
    params:
      activity: "Record Invoice Receipt"
    # RESTRICTED in the Phase 1 review: Consignment items are invoiced outside
    # this log (0 of 14,498 Consignment cases contain the activity), so the
    # rule would flag 100% of that segment as a false violation.
    applies_to_segments:
      - "2-way match"
      - "3-way match, invoice after GR"
      - "3-way match, invoice before GR"
    # checked: missing in 357 / 1,044 (2-way), 4,054 / 15,182 (3-way after GR),
    # 21,446 / 221,010 (3-way before GR). OPEN QUESTION for Phase 2: the log
    # is a time window, so part of these are cases still running at extraction,
    # not breakdowns -- Phase 2 must separate the two before reporting it.

  - id: R-04
    name: goods_receipt_required_for_three_way
    type: activity_must_occur
    description: >-
      Categories that require a goods receipt must contain one; a missing GR
      means the three-way match was bypassed.
    params:
      activity: "Record Goods Receipt"
    applies_to_segments:
      - "3-way match, invoice after GR"
      - "3-way match, invoice before GR"
    # checked: missing in 643 / 15,182 (after GR) and 14,536 / 221,010
    # (before GR); same open-case caveat as R-03.

# --- redesign constraints -------------------------------------------------
# Machine-readable subset of the analyst's constraints, enforced by
# apply_edits (not merely suggested to the LLM).
redesign:
  protected_activities:
    - "Clear Invoice"
  constraints_text:
    - "Invoice clearing is a financial control and may never be removed."
    - "Goods receipt recording cannot be removed for physical-goods categories."
