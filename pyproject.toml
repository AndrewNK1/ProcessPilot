[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "processpilot"
version = "0.1.0"
description = "Agentic AI consultant for the Analysis and Redesign phases of the BPM lifecycle."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Antoni Ashraf" }]

# Upper bounds added after Phase 0: pip had resolved pandas 3.0 and langchain
# 1.4 (both newer majors than expected from memory). Bounds below cap each
# dependency one major above the versions verified working, so a future
# `pip install` can't silently jump to an untested major. See
# requirements.lock for the exact frozen set that was actually tested
# against pandas 3.0 / langchain 1.x.
dependencies = [
    # Deterministic computation layer: every number in the system comes from here.
    "pm4py>=2.7.11,<3.0",
    "pandas>=2.2,<4.0",
    "pyarrow>=15,<27",
    # LP solver for pm4py's Woflan soundness check (Phase 4); without it pm4py
    # falls back to scipy and warns that results "may be unstable". Verified 3.3.2.
    # The <4.0 cap is load-bearing: pm4py 2.7 calls PuLP APIs that 3.x marks
    # deprecated and 4.0 removes (LpVariable(...), PULP_CBC_CMD).
    "pulp>=2.8,<4.0",
    # Typed data crossing module boundaries.
    "pydantic>=2.7,<3.0",
    # Agent orchestration (fixed graph, not a free-roaming agent).
    "langgraph>=0.2.40,<2.0",
    "langchain-core>=0.3,<2.0",
    # init_chat_model lives in `langchain`, which is what makes PP_MODEL provider-swappable.
    "langchain>=0.3,<2.0",
    # Provider package for the default PP_MODEL (anthropic:...); verified 1.7.6.
    # Other providers need their own langchain-<provider> package installed.
    "langchain-anthropic>=1.7,<2.0",
    # Local fallback (PP_MODEL=ollama:...); verified 1.1.0 with Ollama 0.40.5.
    # `reasoning=False` -> Ollama `think: false` (configs/agent.yaml).
    "langchain-ollama>=1.1,<2.0",
    # SQLite checkpointer: human_review's interrupt() must survive a restart.
    "langgraph-checkpoint-sqlite>=3.0,<4.0",
    # Config + secrets.
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
    # Backend API (re-plan 2026-10-24); verified fastapi 0.162.0, uvicorn 0.54.0,
    # python-multipart 0.0.32 (file uploads), httpx 0.28.1 (UI client, TestClient).
    "fastapi>=0.160,<1.0",
    "uvicorn>=0.30,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.40,<2.0",
]
dev = [
    "pytest>=8.0,<10.0",
    "ruff>=0.6,<1.0",
    "jupyter>=1.0,<2.0",
    "ipykernel>=6.29,<7.0",
]
sql = [
    "sqlalchemy>=2.0,<3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The vendored bpmn-js viewer served by the Streamlit component.
processpilot = ["app/components/bpmn_viewer/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep the synthetic-log unit tests the default run; BPI 2019 tests are opt-in because
# they need a 695 MB file that is not part of the repo.
addopts = "-q -m 'not bpi2019 and not llm'"
markers = [
    "bpi2019: integration test requiring the BPI Challenge 2019 log at PP_BPI2019_PATH",
    "llm: integration test calling the real model in PP_MODEL (costs money; opt-in)",
    "ollama: reliability probe against a local Ollama model (slow on CPU; opt-in)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "D"]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
    "ANN401",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103", "ANN201", "ANN001"]
"notebooks/*" = ["D", "ANN", "E402"]  # load_dotenv() intentionally precedes later imports

[tool.ruff.lint.pydocstyle]
convention = "google"
